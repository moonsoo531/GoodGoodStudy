name: offline_player
description: Local-first study, quizzes and media with optional iCloud Documents sync.
publish_to: none
version: 0.9.0+31

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_macos_video: 1.1.4
  file_picker: 12.3.0
  path_provider: 2.1.6
  archive: 4.5.2
  crypto: 3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/goodgoodstudy-icon.png
    - assets/licenses/GoodGoodStudy-MIT.txt
